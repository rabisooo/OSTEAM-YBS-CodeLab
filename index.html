<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>OSTEAM YBS CodeLab</title>
</head>
<body>
    <header>
        <a href="/">OSTEAM YBS CodeLab</a>
        <nav>
            <a href="#">Events</a>
            <a href="#">About</a>
            <a href="#">Join</a>
        </nav>
    </header>

    <main>
        <h1>Upcoming Events</h1>
        
        <!-- Kartların yer alacağı Grid alanı -->
        <section class="cards">
            <article>
                <h2>Python Workshop</h2>
                <p>Oct 22 - Lab 3</p>
            </article>
            <article>
                <h2>Web Dev Bootcamp</h2>
                <p>Oct 25 - Conference Hall</p>
            </article>
            <article>
                <h2>AI & Future Trends</h2>
                <p>Nov 02 - Online</p>
            </article>
        </section>

        <!-- JavaScript ile dinamik dolacak liste -->
        <section style="margin-top: 40px;">
            <h2>Task List</h2>
            <ul id="task-list"></ul>
        </section>

        <!-- Kayıt ve Etkinlik Ekleme Formu -->
        <section class="form-section" style="margin-top: 40px;">
            <h2>Add New Event / Task</h2>
            <form id="task-form">
                <label for="task-input">Event Title</label><br>
                <input id="task-input" required style="margin-bottom: 10px; padding: 8px;"><br>
                <p id="error" style="color: red;"></p>

                <button type="submit" style="padding: 10px 20px;">Add Task</button>
            </form>
        </section>
    </main>

    <footer>
        <p style="text-align: center; padding: 20px;">OSTEAM YBS CodeLab © 2026</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
